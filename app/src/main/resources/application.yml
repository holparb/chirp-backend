spring:
  application:
    name: chirp-backend

  data:
    redis:
      host: "fun-sunstone-house-64875.db.redis.io"
      password: ${REDIS_PASSWORD}
      username: "default"
      port: 18529
      connect-timeout: 5000
      timeout: 2000

  datasource:
    url: jdbc:postgresql://aws-0-eu-central-1.pooler.supabase.com:5432/postgres
    username: postgres.hikddacgxrsigthorcvc
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 12000000
      validation-timeout: 5000
      pool-name: SpringBootHikariCP
      data-source-properties:
        prepareThreshold: 5
        preparedStatementCacheQueries: 256
        preparedStatementCacheSizeMiB: 5

        tcpKeepAlive: true
        socketTimeout: 30
        connectTimeout: 10
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        show_sql: true

jwt:
  secret: ${JWT_SECRET_BASE64}

chirp-backend:
  email:
    verification:
      expiry-hours: 24
    reset-password:
      expiry-minutes: 15